[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caudal-backend"
version = "0.1.0"
description = "Caudal personal finance backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pdfplumber>=0.11",
    "pypdf2>=3.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "httpx>=0.27",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "python-dateutil>=2.9",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
